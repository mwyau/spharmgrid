version: 2

updates:
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: daily
    groups:
      python-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: pre-commit
    directory: "/"
    schedule:
      interval: daily
    groups:
      pre-commit:
        patterns: ["*"]
