version: 2

updates:
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: daily
    versioning-strategy: lockfile-only
    groups:
      python-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    groups:
      github-actions:
        patterns: ["*"]
