name: Python Publish

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: python-publish-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

env:
  UV_VERSION: "0.12.10"
  PYTHON_VERSION: "3.14"

jobs:
  package:
    name: Package tests
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Verify release tag version
        if: github.ref_type == 'tag'
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          uv run --no-project python - <<'PY'
          import os
          import tomllib

          tag = os.environ["TAG_NAME"]
          with open("pyproject.toml", "rb") as pyproject_file:
              package_version = tomllib.load(pyproject_file)["project"]["version"]

          print(f"package version: {package_version}")
          print(f"tag:             {tag}")
          if tag != f"v{package_version}":
              raise SystemExit(
                  f"release tag {tag!r} does not match package version "
                  f"{package_version!r}"
              )
          PY

      - name: Build wheel and source distribution
        run: uv build --wheel --sdist

      - name: Create wheel test environment
        run: uv venv --seed .wheel-venv

      - name: Install wheel using pip
        run: .wheel-venv/bin/python -m pip install --no-cache-dir dist/*.whl

      - name: Test wheel import
        run: .wheel-venv/bin/python -c 'import spharmgrid; print("wheel import success")'

      - name: Test installed CLI
        run: .wheel-venv/bin/spharmgrid --help

      - name: Check distributions
        run: uvx --from twine==7.0.0 twine check --strict dist/*

      - name: Verify distribution contents and versions
        env:
          SOURCE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          uv run --no-project python - <<'PY'
          import os
          import tarfile
          import zipfile
          from email.parser import Parser
          from pathlib import Path

          def metadata_version(path: Path) -> str:
              if path.name.endswith(".whl"):
                  with zipfile.ZipFile(path) as archive:
                      member_name = next(
                          name
                          for name in archive.namelist()
                          if name.endswith(".dist-info/METADATA")
                      )
                      metadata = archive.read(member_name).decode()
              elif path.name.endswith(".tar.gz"):
                  with tarfile.open(path, mode="r:gz") as archive:
                      member_name = next(
                          name
                          for name in archive.getnames()
                          if name.endswith("/PKG-INFO") or name == "PKG-INFO"
                      )
                      member = archive.extractfile(member_name)
                      if member is None:
                          raise ValueError(f"cannot read metadata from {path}")
                      metadata = member.read().decode()
              else:
                  raise ValueError(f"unexpected distribution: {path}")

              version = Parser().parsestr(metadata).get("Version")
              if not version:
                  raise ValueError(f"distribution has no version: {path}")
              return version

          distributions = sorted(
              path
              for path in Path("dist").iterdir()
              if path.is_file()
              and (path.name.endswith(".whl") or path.name.endswith(".tar.gz"))
          )
          if not distributions:
              raise SystemExit("no wheel or source distribution found")

          versions = {metadata_version(path) for path in distributions}
          if len(versions) != 1:
              raise SystemExit(f"distribution versions do not agree: {versions}")

          version = versions.pop()
          tag = os.environ["SOURCE_TAG"]
          print(f"artifact version: {version}")
          if tag and tag != f"v{version}":
              raise SystemExit(
                  f"source tag {tag!r} does not match artifact version {version!r}"
              )

          sdist = next(path for path in distributions if path.name.endswith(".tar.gz"))
          excluded = (".github/", "plans/", "skills/", "AGENTS.md")
          with tarfile.open(sdist, mode="r:gz") as archive:
              members = archive.getnames()
          relative_members = [
              name.split("/", 1)[1] if "/" in name else name for name in members
          ]
          leaked = [
              name
              for name in relative_members
              if any(name == item or name.startswith(item) for item in excluded)
          ]
          if leaked:
              raise SystemExit(f"repository-only files leaked into sdist: {leaked}")
          PY

      - name: Upload release distributions
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: release-dists
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish distributions
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment:
      name: ${{ contains(github.ref_name, '.dev') && 'testpypi' || 'pypi' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Retrieve tested distributions
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-dists
          path: dist/

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: dist/
          repository-url: >-
            ${{
              contains(github.ref_name, '.dev')
              && 'https://test.pypi.org/legacy/'
              || 'https://upload.pypi.org/legacy/'
            }}
