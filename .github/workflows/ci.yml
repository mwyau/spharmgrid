name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

env:
  UV_VERSION: "0.12.10"

jobs:
  code-quality:
    name: Code quality (Python 3.14)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.14"
      - name: Check lockfile
        run: uv lock --check
      - run: uv sync --extra cf --extra dask --frozen
      - run: uv run --no-sync ruff check src tests docs/conf.py
      - run: uv run --no-sync ruff format --check src tests docs/conf.py
      - run: uv run --no-sync ty check
      - run: uvx prek run spdx --all-files

  tests:
    name: Unit tests (${{ matrix.name }}, Python ${{ matrix.python }})
    needs: code-quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            name: Ubuntu
            python: "3.11"
          - os: ubuntu-26.04
            name: Ubuntu
            python: "3.12"
          - os: ubuntu-26.04
            name: Ubuntu
            python: "3.13"
          - os: ubuntu-26.04
            name: Ubuntu
            python: "3.14"
          - os: windows-2025
            name: Windows
            python: "3.13"
          - os: macos-26
            name: macOS
            python: "3.14"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --no-default-groups --group test --frozen
      - name: Run unit tests
        if: ${{ matrix.os != 'ubuntu-26.04' || matrix.python != '3.14' }}
        run: uv run --no-sync pytest tests/unit
      - name: Run unit tests with coverage
        if: ${{ matrix.os == 'ubuntu-26.04' && matrix.python == '3.14' }}
        run: >-
          uv run --no-sync pytest
          tests/unit
          --cov=spharmgrid
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml:coverage-unit.xml
          --junitxml=junit-unit.xml
          -o junit_family=legacy
      - name: Upload unit test results to Codecov
        if: ${{ !cancelled() && matrix.os == 'ubuntu-26.04' && matrix.python == '3.14' && hashFiles('junit-unit.xml') != '' }}
        uses: codecov/codecov-action@v7.1.0
        with:
          files: ./junit-unit.xml
          report_type: test_results
          flags: unit
          name: unit-py314
          token: ${{ secrets.CODECOV_TOKEN }}
          disable_search: true
          fail_ci_if_error: false
      - name: Upload unit coverage to Codecov
        if: ${{ success() && matrix.os == 'ubuntu-26.04' && matrix.python == '3.14' && hashFiles('coverage-unit.xml') != '' }}
        uses: codecov/codecov-action@v7.1.0
        with:
          files: ./coverage-unit.xml
          flags: unit
          name: unit-py314
          token: ${{ secrets.CODECOV_TOKEN }}
          disable_search: true
          fail_ci_if_error: false

  torch:
    name: Torch tests (Python 3.12)
    needs: code-quality
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          save-cache: false
          python-version: "3.12"
      - run: uv sync --no-default-groups --group dev --extra cf --extra dask --extra torch --frozen
      - name: Type-check with Torch installed
        run: uv run --no-sync ty check
      - name: Run Torch tests with coverage
        run: >-
          uv run --no-sync pytest
          tests/optional/torch
          --cov=src/spharmgrid/torch
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml:coverage-torch.xml
          --junitxml=junit-torch.xml
          -o junit_family=legacy
      - name: Upload Torch test results
        if: ${{ !cancelled() && hashFiles('junit-torch.xml') != '' }}
        uses: codecov/codecov-action@v7.0.0
        with:
          files: ./junit-torch.xml
          report_type: test_results
          flags: torch
          name: torch-py312
          token: ${{ secrets.CODECOV_TOKEN }}
          disable_search: true
          fail_ci_if_error: false
      - name: Upload Torch coverage
        if: ${{ !cancelled() && hashFiles('coverage-torch.xml') != '' }}
        uses: codecov/codecov-action@v7.0.0
        with:
          files: ./coverage-torch.xml
          flags: torch
          name: torch-py312
          token: ${{ secrets.CODECOV_TOKEN }}
          disable_search: true
          fail_ci_if_error: false

  optional:
    name: Optional tests (Python 3.14)
    needs: code-quality
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          save-cache: false
          python-version: "3.14"
      - run: >-
          uv sync
          --no-default-groups
          --group test
          --extra cf
          --extra dask
          --extra cli
          --frozen
      - name: Run optional tests with coverage
        run: >-
          uv run --no-sync pytest
          tests/optional/test_cf_xarray.py
          tests/optional/test_dask.py
          tests/optional/test_cli_backends.py
          --cov=spharmgrid
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml:coverage-optional.xml
          --junitxml=junit-optional.xml
          -o junit_family=legacy
      - name: Upload optional test results to Codecov
        if: ${{ !cancelled() && hashFiles('junit-optional.xml') != '' }}
        uses: codecov/codecov-action@v7.1.0
        with:
          files: ./junit-optional.xml
          report_type: test_results
          flags: optional
          name: optional-py314
          token: ${{ secrets.CODECOV_TOKEN }}
          disable_search: true
          fail_ci_if_error: false
      - name: Upload optional coverage to Codecov
        if: ${{ !cancelled() && hashFiles('coverage-optional.xml') != '' }}
        uses: codecov/codecov-action@v7.1.0
        with:
          files: ./coverage-optional.xml
          flags: optional
          name: optional-py314
          token: ${{ secrets.CODECOV_TOKEN }}
          disable_search: true
          fail_ci_if_error: false

  free-threaded:
    name: Free-threaded tests (Python 3.14t)
    needs: code-quality
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.14t"
      - run: uv sync --no-default-groups --frozen
      - name: Check core free-threaded imports
        shell: bash
        run: |
          check_import() {
            local module="$1"
            uv run --no-sync python - "$module" <<'PY'
          import importlib
          import sys

          module = sys.argv[1]
          try:
              importlib.import_module(module)
          except Exception as exc:
              print(f"::warning::{module} failed to import on free-threaded Python: {exc}")
              raise SystemExit(0)

          gil_enabled = sys._is_gil_enabled()
          print(f"{module:12}: GIL {'ON' if gil_enabled else 'OFF'}")
          if gil_enabled:
              print(f"::warning::{module} enables the GIL on free-threaded Python")
          PY
          }

          check_import numpy
          check_import xarray
          check_import ducc0

  minimum-dependencies:
    name: Minimum-dependency tests (Python 3.11)
    needs: code-quality
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          save-cache: false
          python-version: "3.11"
      - run: uv sync --no-default-groups --group test --extra cf --extra dask --resolution lowest-direct
      - run: >-
          uv run --no-sync pytest
          tests/unit
          tests/optional/test_cf_xarray.py
          tests/optional/test_dask.py

  docs:
    name: Docs tests (Python 3.14)
    needs: code-quality
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          save-cache: false
          python-version: "3.14"
      - run: uv sync --no-default-groups --group docs --frozen
      - run: uv run --no-sync sphinx-build -W --keep-going -b html docs docs/_build/html

  parity:
    name: Parity tests (Python 3.12)
    needs: code-quality
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          save-cache: false
          python-version: "3.12"
      - run: >-
          uv sync
          --no-default-groups
          --group test
          --group parity
          --extra torch
          --frozen
      # pyspharm-syl 1.2.1 is built against the NumPy 1.x C API, while the
      # frozen lock currently resolves the direct NumPy dependency to 2.x.
      - name: Install pyspharm-compatible NumPy
        run: uv pip install --python .venv/bin/python "numpy<2"
      - name: Run parity tests with coverage
        run: >-
          uv run --no-sync pytest
          tests/parity
          --cov=spharmgrid
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml:coverage-parity.xml
          --junitxml=junit-parity.xml
          -o junit_family=legacy
      - name: Upload parity test results to Codecov
        if: ${{ !cancelled() && hashFiles('junit-parity.xml') != '' }}
        uses: codecov/codecov-action@v7.1.0
        with:
          files: ./junit-parity.xml
          report_type: test_results
          flags: parity
          name: parity-py312
          token: ${{ secrets.CODECOV_TOKEN }}
          disable_search: true
          fail_ci_if_error: false
      - name: Upload parity coverage to Codecov
        if: ${{ !cancelled() && hashFiles('coverage-parity.xml') != '' }}
        uses: codecov/codecov-action@v7.1.0
        with:
          files: ./coverage-parity.xml
          flags: parity
          name: parity-py312
          token: ${{ secrets.CODECOV_TOKEN }}
          disable_search: true
          fail_ci_if_error: false
