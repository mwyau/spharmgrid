name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

env:
  UV_VERSION: "0.12.10"

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            python: "3.12"
          - os: ubuntu-26.04
            python: "3.13"
          - os: ubuntu-26.04
            python: "3.14"
          - os: windows-2025
            python: "3.13"
          - os: macos-26
            python: "3.14"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --group dev --extra cf --extra dask --frozen
      - run: uv run --no-sync pytest

  free-threaded:
    name: Free-threaded Python 3.14 compatibility
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.14t"
      - run: uv sync --extra cf --extra dask --extra netcdf --extra zarr --frozen
      - name: Check free-threaded imports independently
        shell: bash
        run: |
          check_import() {
            local group="$1"
            local module="$2"
            uv run --no-sync python - "$group" "$module" <<'PY'
          import importlib
          import sys

          group, module = sys.argv[1:]
          try:
              importlib.import_module(module)
          except Exception as exc:
              print(f"::warning::{group}: {module} failed to import on free-threaded Python: {exc}")
              raise SystemExit(0)

          gil_enabled = sys._is_gil_enabled()
          print(f"{group:8} {module:12}: GIL {'ON' if gil_enabled else 'OFF'}")
          if gil_enabled:
              print(f"::warning::{group}: {module} enables the GIL on free-threaded Python")
          PY
          }

          check_import core numpy
          check_import core xarray
          check_import core ducc0
          check_import cf cf_xarray
          check_import dask dask
          check_import netcdf h5netcdf
          check_import zarr zarr
          check_import package spharmgrid

  minimum-dependencies:
    name: Minimum direct dependencies
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --group test --extra dask --resolution lowest-direct
      - run: uv run --no-sync pytest

  code-quality:
    name: Code quality
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --group dev --extra cf --extra dask --frozen
      - run: uv run --no-sync ruff check src tests
      - run: uv run --no-sync ruff format --check src tests
      - run: uv run --no-sync ty check

  docs:
    name: Documentation
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --group docs --frozen
      - run: uv run --no-sync sphinx-build -W --keep-going -b html docs docs/_build/html

  parity:
    name: SPHEREPACK parity
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --group test --group parity --extra dask --frozen
      - run: uv run --no-sync pytest tests/parity
