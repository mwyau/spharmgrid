name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

env:
  UV_VERSION: "0.12.10"

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            python: "3.12"
          - os: ubuntu-26.04
            python: "3.13"
          - os: ubuntu-26.04
            python: "3.14"
          - os: windows-2025
            python: "3.13"
          - os: macos-26
            python: "3.14"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --group dev --all-extras --frozen
      - run: uv run --no-sync pytest

  free-threaded:
    name: Free-threaded Python 3.14 (non-blocking)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.14t"
      - run: uv sync --extra cf --frozen
      - name: Verify imports keep the GIL disabled
        run: |
          uv run --no-sync python - <<'PY'
          import sys

          if sys._is_gil_enabled():
              raise RuntimeError("GIL is enabled at interpreter startup")

          modules = (
              "numpy",
              "pandas",
              "xarray",
              "cf_xarray",
              "ducc0",
              "spharmgrid",
          )
          for name in modules:
              __import__(name)
              gil_enabled = sys._is_gil_enabled()
              print(f"{name:12}: GIL {'ON' if gil_enabled else 'OFF'}")
              if gil_enabled:
                  raise RuntimeError(f"{name} caused the GIL to become enabled")
          PY

  minimum-dependencies:
    name: Minimum direct dependencies
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --group test --all-extras --resolution lowest-direct
      - run: uv run --no-sync pytest

  code-quality:
    name: Code quality
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --group dev --all-extras --frozen
      - run: uv run --no-sync ruff check src tests
      - run: uv run --no-sync ruff format --check src tests
      - run: uv run --no-sync ty check

  docs:
    name: Documentation
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --group docs --frozen
      - run: uv run --no-sync sphinx-build -W --keep-going -b html docs docs/_build/html

  parity:
    name: SPHEREPACK parity
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --group test --group parity --all-extras --frozen
      - run: uv run --no-sync pytest tests/parity

  release:
    name: Release
    if: github.ref_type == 'tag'
    needs: [tests, minimum-dependencies, code-quality, docs, parity]
    uses: ./.github/workflows/python-publish.yml
    with:
      source_sha: ${{ github.sha }}
      source_tag: ${{ github.ref_name }}
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
