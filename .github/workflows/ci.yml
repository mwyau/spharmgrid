name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

env:
  UV_VERSION: "0.12.10"

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            python: "3.12"
          - os: ubuntu-26.04
            python: "3.13"
          - os: ubuntu-26.04
            python: "3.14"
          - os: windows-2025
            python: "3.13"
          - os: macos-26
            python: "3.14"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --group dev --extra dask --frozen
      - run: uv run --no-sync pytest

  free-threaded:
    name: Free-threaded Python 3.14 compatibility
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.14t"
      - run: uv sync --all-extras --frozen
      - name: Check dependencies independently with the GIL disabled
        run: |
          uv run --no-sync python - <<'PY'
          import subprocess
          import sys

          checks = (
              ("core", "numpy"),
              ("core", "xarray"),
              ("core", "ducc0"),
              ("cf", "cf_xarray"),
              ("dask", "dask"),
              ("io", "h5netcdf"),
              ("io", "h5py"),
              ("package", "spharmgrid"),
          )

          probe = (
              "import importlib, sys; "
              "importlib.import_module(sys.argv[1]); "
              "print('ON' if sys._is_gil_enabled() else 'OFF')"
          )

          if sys._is_gil_enabled():
              print("::warning::GIL is enabled at interpreter startup")

          for group, module in checks:
              result = subprocess.run(
                  [sys.executable, "-c", probe, module],
                  capture_output=True,
                  text=True,
                  check=False,
              )
              status = result.stdout.strip().splitlines()[-1] if result.stdout.strip() else "UNKNOWN"
              print(f"{group:7} {module:12}: GIL {status}")

              if result.returncode != 0:
                  detail = result.stderr.strip().replace("\n", " ")
                  print(f"::warning::{group} dependency {module} failed to import: {detail}")
              elif status == "ON":
                  print(
                      f"::warning::{group} dependency {module} enables the GIL "
                      "under free-threaded Python"
                  )
          PY

  minimum-dependencies:
    name: Minimum direct dependencies
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --group test --extra dask --resolution lowest-direct
      - run: uv run --no-sync pytest

  code-quality:
    name: Code quality
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --group dev --extra dask --frozen
      - run: uv run --no-sync ruff check src tests
      - run: uv run --no-sync ruff format --check src tests
      - run: uv run --no-sync ty check

  docs:
    name: Documentation
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --group docs --frozen
      - run: uv run --no-sync sphinx-build -W --keep-going -b html docs docs/_build/html

  parity:
    name: SPHEREPACK parity
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --group test --group parity --extra dask --frozen
      - run: uv run --no-sync pytest tests/parity
