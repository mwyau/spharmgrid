name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

env:
  UV_VERSION: "0.12.10"

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            python: "3.12"
          - os: ubuntu-26.04
            python: "3.13"
          - os: ubuntu-26.04
            python: "3.14"
          - os: windows-2025
            python: "3.13"
          - os: macos-26
            python: "3.14"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --group dev --all-extras --frozen
      - run: uv run --no-sync pytest

  minimum-dependencies:
    name: Minimum direct dependencies
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --group test --all-extras --resolution lowest-direct
      - run: uv run --no-sync pytest

  code-quality:
    name: Code quality
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --group dev --all-extras --frozen
      - run: uv run --no-sync ruff check src tests
      - run: uv run --no-sync ruff format --check src tests
      - run: uv run --no-sync ty check

  docs:
    name: Documentation
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --group docs --frozen
      - run: uv run --no-sync sphinx-build -W --keep-going -b html docs docs/_build/html

  parity:
    name: SPHEREPACK parity
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --group test --group parity --all-extras --frozen
      - run: uv run --no-sync pytest tests/parity

  package:
    name: Package distributions
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.14"

      - name: Verify release tag version
        if: github.ref_type == 'tag'
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          uv run --no-project python - <<'PY'
          import os
          import tomllib

          tag = os.environ["TAG_NAME"]
          with open("pyproject.toml", "rb") as pyproject_file:
              package_version = tomllib.load(pyproject_file)["project"]["version"]

          print(f"package version: {package_version}")
          print(f"tag:             {tag}")
          if tag != f"v{package_version}":
              raise SystemExit(
                  f"release tag {tag!r} does not match package version "
                  f"{package_version!r}"
              )
          PY

      - run: uv build --wheel --sdist
      - run: uv venv .wheel-venv
      - run: uv pip install --python .wheel-venv/bin/python dist/*.whl
      - run: .wheel-venv/bin/python -c 'import spharmgrid; print("wheel import success")'
      - run: .wheel-venv/bin/spharmgrid --help
      - name: Check distributions
        run: uvx --from twine==7.0.0 twine check --strict dist/*
      - name: Upload release distributions
        uses: actions/upload-artifact@v7
        with:
          name: release-dists
          path: dist/
          if-no-files-found: error
