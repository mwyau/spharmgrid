name: Threading refactor

on:
  push:
    branches: [fix/automatic-ducc-threading]

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.10"
          python-version: "3.14"
      - name: Apply automatic DUCC threading policy
        run: |
          python - <<'PY'
          from __future__ import annotations

          import re
          from pathlib import Path

          root = Path('.')

          def read(path: str) -> str:
              return (root / path).read_text()

          def write(path: str, text: str) -> None:
              (root / path).write_text(text)

          path = 'src/spharmgrid/_ducc.py'
          text = read(path)
          text = text.replace(
              'Geometry = Literal["CC", "GL"]\n',
              'Geometry = Literal["CC", "GL"]\n\nDUCC_THREADS = 4\n',
          )
          text = re.sub(r'^\s{4}nthreads: int,\n', '', text, flags=re.M)
          text = text.replace('nthreads=nthreads,', 'nthreads=DUCC_THREADS,')
          write(path, text)

          source_paths = [
              'src/spharmgrid/_vector.py',
              'src/spharmgrid/_xarray.py',
              'src/spharmgrid/accessors.py',
              'src/spharmgrid/cli.py',
              'src/spharmgrid/kinematics.py',
              'src/spharmgrid/operators.py',
              'src/spharmgrid/regrid.py',
              'src/spharmgrid/spectral.py',
          ]

          for path in source_paths:
              text = read(path)
              text = re.sub(r'^\s*nthreads: int \| None(?: = None)?,\n', '', text, flags=re.M)
              text = text.replace(', nthreads: int | None = None', '')
              text = text.replace(', nthreads: int | None', '')
              text = re.sub(r'^\s*nthreads=(?:nthreads|threads),\n', '', text, flags=re.M)
              text = re.sub(r'^\s*nthreads=arguments\.nthreads,\n', '', text, flags=re.M)
              text = text.replace(', nthreads=nthreads', '')
              text = re.sub(r'^\s*threads: int,\n', '', text, flags=re.M)
              text = text.replace(', threads: int', '')
              text = text.replace(', threads)', ')')
              text = text.replace(', threads,', ',')
              text = text.replace('transform(frame, threads)', 'transform(frame)')
              text = text.replace('transform(frame_u, frame_v, threads)', 'transform(frame_u, frame_v)')
              text = re.sub(r'^\s*resolve_nthreads,\n', '', text, flags=re.M)
              text = re.sub(r'^\s*threads = resolve_nthreads\([^\n]+\)\n', '', text, flags=re.M)
              text = re.sub(r'^\s*[^\n]*add_argument\("--nthreads"[^\n]*\n', '', text, flags=re.M)
              text = text.replace('[NDArray[np.generic], int]', '[NDArray[np.generic]]')
              text = text.replace('[NDArray[np.generic], NDArray[np.generic], int]', '[NDArray[np.generic], NDArray[np.generic]]')
              text = text.replace('    *,\n)', ')')
              write(path, text)

          path = 'src/spharmgrid/_xarray.py'
          text = read(path)
          text = text.replace('from collections.abc import Callable, Hashable\n', 'from collections.abc import Callable, Hashable\nimport os\n')
          text = text.replace('from .grids import (\n', 'from ._ducc import DUCC_THREADS\nfrom .grids import (\n')
          text = re.sub(r'\n\ndef resolve_nthreads\(.*?\n\ndef require_dataarray', '\n\ndef require_dataarray', text, flags=re.S)
          old = '''    if field.chunks is None:\n        return {"dask": "forbidden"}\n    # xarray's public ``dask_gufunc_kwargs`` annotation accepts\n'''
          new = '''    if field.chunks is None:\n        return {"dask": "forbidden"}\n    _configure_local_dask_workers()\n    # xarray's public ``dask_gufunc_kwargs`` annotation accepts\n'''
          text = text.replace(old, new)
          marker = '\n\ndef restore_output(\n'
          helper = '''\n\ndef _configure_local_dask_workers() -> None:\n    """Limit default local Dask parallelism for internally threaded DUCC tasks."""\n    import dask\n\n    if dask.config.get("num_workers", default=None) is not None:\n        return\n    available_cpus = os.cpu_count() or 1\n    dask.config.set(num_workers=max(1, available_cpus // DUCC_THREADS))\n'''
          text = text.replace(marker, helper + marker)
          write(path, text)

          path = 'src/spharmgrid/_vector.py'
          text = read(path)
          text = text.replace('[NDArray[np.generic], NDArray[np.generic], int], NDArray[np.float64]', '[NDArray[np.generic], NDArray[np.generic]], NDArray[np.float64]')
          text = text.replace('[NDArray[np.generic], NDArray[np.generic], int],\n', '[NDArray[np.generic], NDArray[np.generic]],\n')
          write(path, text)

          path = 'src/spharmgrid/spectral.py'
          text = read(path).replace('Callable[[NDArray[np.generic], int], NDArray[np.float64]]', 'Callable[[NDArray[np.generic]], NDArray[np.float64]]')
          write(path, text)

          path = 'src/spharmgrid/operators.py'
          text = read(path).replace('[NDArray[np.generic], int], tuple[NDArray[np.float64], NDArray[np.float64]]', '[NDArray[np.generic]], tuple[NDArray[np.float64], NDArray[np.float64]]')
          write(path, text)

          path = 'docs/api.md'
          text = read(path).replace(', nthreads=None', '')
          text = re.sub(
              r'## Threading\n\n.*?\n\n## xarray accessors',
              '## Execution\n\nDUCC transforms use four threads internally. For Dask-backed arrays, spharmgrid sets the default local Dask worker count to `max(1, os.cpu_count() // 4)` when `num_workers` has not already been configured. Existing Dask configuration and distributed cluster topology are left unchanged.\n\n## xarray accessors',
              text,
              flags=re.S,
          )
          write(path, text)

          path = 'docs/cf.md'
          text = read(path).replace(
              'Dask-backed xarray fields remain lazy. Horizontal core dimensions are rechunked when required by xarray generalized ufunc execution. The default is one DUCC thread per Dask task; pass `nthreads=` to use another value.',
              'Dask-backed xarray fields remain lazy. Horizontal core dimensions are rechunked when required by xarray generalized ufunc execution. DUCC uses four threads per transform. When the local Dask scheduler has no explicit `num_workers` setting, spharmgrid sets it to `max(1, os.cpu_count() // 4)` to limit nested CPU oversubscription. Existing Dask configuration and distributed cluster topology are left unchanged.',
          )
          write(path, text)

          path = 'README.md'
          text = read(path)
          needle = '- `spharmgrid[dask]` — Dask-backed lazy execution;\n'
          text = text.replace(needle, needle + '\nDask-backed transforms remain lazy. DUCC uses four threads per transform; for the local Dask scheduler, spharmgrid defaults to roughly one concurrent transform per four available CPUs unless `num_workers` is already configured.\n')
          write(path, text)

          path = 'plans/01-core.md'
          text = re.sub(
              r'`nthreads` is the only DUCC execution control\..*?(?=\n\n)',
              'DUCC uses four threads per transform internally. For Dask-backed arrays, the default local scheduler worker count is `max(1, os.cpu_count() // 4)` unless the application already configured `num_workers`. Do not expose backend thread tuning in the public API.',
              read(path),
              flags=re.S,
          )
          write(path, text)

          path = 'plans/02-sht-suite.md'
          write(path, re.sub(r'^\s*nthreads=None,\n', '', read(path), flags=re.M))

          check_paths = [*source_paths, 'docs/api.md', 'docs/cf.md', 'README.md', 'plans/01-core.md', 'plans/02-sht-suite.md', 'AGENTS.md']
          leftovers = []
          for path in check_paths:
              for number, line in enumerate(read(path).splitlines(), 1):
                  if 'nthreads' in line or 'resolve_nthreads' in line:
                      leftovers.append(f'{path}:{number}:{line}')
          if leftovers:
              raise SystemExit('Unexpected public threading references:\n' + '\n'.join(leftovers))
          PY
      - name: Format and validate
        run: |
          uv sync --group dev --extra cf --extra dask --frozen
          uv run --no-sync ruff check --fix src tests
          uv run --no-sync ruff format src tests
          uv run --no-sync ruff check src tests
          uv run --no-sync ruff format --check src tests
          uv run --no-sync ty check
          uv run --no-sync pytest tests/unit tests/optional/test_cf_xarray.py
          uv run --no-sync sphinx-build -W --keep-going -b html docs docs/_build/html
      - name: Show remaining threading references
        run: |
          grep -RInE "nthreads|resolve_nthreads|DUCC_THREADS|num_workers" src tests docs README.md plans AGENTS.md || true
      - name: Commit refactor
        run: |
          rm -f .github/workflows/threading-refactor.yml .github/workflows/threading-audit2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use automatic DUCC threading"
          git push
