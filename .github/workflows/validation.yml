name: Validation tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "0.12.17"

jobs:
  ncl-parity:
    name: NCL/SPHEREPACK parity tests
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          auto-activate: false
          channels: conda-forge
          channel-priority: strict

      - name: Install NCL 6.6.2
        run: conda create --yes --name spharmgrid-ncl --channel conda-forge ncl=6.6.2

      - name: Set up Python environment
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.14"

      - name: Install Python test environment
        run: uv sync --no-default-groups --group test --extra cli --frozen

      - name: Generate deterministic Python inputs
        run: |
          set -o pipefail
          mkdir -p \
            "$RUNNER_TEMP/spharmgrid-ncl/inputs" \
            "$RUNNER_TEMP/spharmgrid-ncl/outputs" \
            "$RUNNER_TEMP/spharmgrid-ncl/normalized"
          uv run --no-sync python tests/ncl/generate_inputs.py \
            --output-dir "$RUNNER_TEMP/spharmgrid-ncl/inputs" \
            2>&1 | tee "$RUNNER_TEMP/spharmgrid-ncl/outputs/generate-inputs.log"

      - name: Generate NCL outputs
        run: |
          set -o pipefail
          for grid in gl cc; do
            for family in analytic random; do
              SPHARMGRID_NCL_INPUT="$RUNNER_TEMP/spharmgrid-ncl/inputs/input-${grid}-${family}.nc" \
              SPHARMGRID_NCL_OUTPUT="$RUNNER_TEMP/spharmgrid-ncl/outputs/ncl-${grid}-${family}.nc" \
              SPHARMGRID_NCL_GRID="$grid" \
              SPHARMGRID_NCL_FAMILY="$family" \
              conda run --no-capture-output --name spharmgrid-ncl \
                ncl -Q tests/ncl/generate_references.ncl \
                2>&1 | tee "$RUNNER_TEMP/spharmgrid-ncl/outputs/ncl-${grid}-${family}.log"
            done
          done

      - name: Normalize NCL outputs
        run: |
          set -o pipefail
          uv run --no-sync python tests/ncl/normalize_references.py \
            --input-dir "$RUNNER_TEMP/spharmgrid-ncl/inputs" \
            --ncl-output-dir "$RUNNER_TEMP/spharmgrid-ncl/outputs" \
            --output-dir "$RUNNER_TEMP/spharmgrid-ncl/normalized" \
            2>&1 | tee "$RUNNER_TEMP/spharmgrid-ncl/outputs/normalize-references.log"

      - name: Run spharmgrid against NCL outputs
        run: |
          set -o pipefail
          SPHARMGRID_NCL_OUTPUT_DIR="$RUNNER_TEMP/spharmgrid-ncl/normalized" \
            uv run --no-sync pytest tests/ncl/test_ncl.py \
            2>&1 | tee "$RUNNER_TEMP/spharmgrid-ncl/outputs/pytest-ncl.log"

      - name: Upload NCL parity diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ncl-parity-output-${{ github.run_id }}
          path: ${{ runner.temp }}/spharmgrid-ncl
          if-no-files-found: warn
          retention-days: 14

  jax-integration:
    name: xarray_jax integration (Python 3.14)
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.14"

      - name: Sync JAX environment
        run: uv sync --no-default-groups --group jax-dev --frozen

      - name: Run xarray_jax tests
        env:
          JAX_ENABLE_X64: "1"
        run: uv run --no-sync pytest tests/optional/jax/test_xarray_jax.py

  torch-integration:
    name: torch-harmonics integration (Python 3.14)
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          save-cache: false
          python-version: "3.14"

      - name: Sync test environment
        run: uv sync --no-default-groups --group test --frozen

      - name: Install Torch 2.14 CPU
        run: uv pip install --python .venv/bin/python --index https://download.pytorch.org/whl/cpu "torch==2.14.0+cpu"

      - name: Build torch-harmonics 0.9.2
        run: >-
          uv pip install
          --python .venv/bin/python
          --index https://download.pytorch.org/whl/cpu
          --no-deps
          "torch==2.14.0+cpu"
          "torch-harmonics @ git+https://github.com/NVIDIA/torch-harmonics.git@v0.9.2"

      - name: Verify versions
        run: >-
          uv run --no-sync python -c
          "import sys; import torch; from importlib.metadata import version;
          assert sys.version_info[:2] == (3, 14);
          assert torch.__version__ == '2.14.0+cpu';
          assert torch.version.cuda is None;
          assert version('torch-harmonics') == '0.9.2'"

      - name: Run Torch tests
        run: uv run --no-sync pytest tests/optional/torch
