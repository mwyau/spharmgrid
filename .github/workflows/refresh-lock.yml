name: Refresh lock

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "0.12.10"

jobs:
  lock:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
      - run: uv lock
      - uses: actions/upload-artifact@v4
        with:
          name: uv-lock
          path: uv.lock
          if-no-files-found: error
