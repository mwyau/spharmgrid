repos:
  - repo: builtin
    hooks:
      - id: check-json
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.13
    hooks:
      - id: uv-lock

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.80
    hooks:
      - id: ty
        # The normal hook checks src/spharmgrid/torch with unresolved optional
        # imports allowed. Torch CI repeats the type check with the torch extra.
        args: [--isolated, --python=3.12, --group=dev, --extra=cf, --extra=dask]
        pass_filenames: false

  - repo: https://github.com/hukkin/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        args: [--number]
        additional_dependencies:
          - mdformat-beautysh
          - mdformat-config
          - mdformat-gfm
          - mdformat-gfm-alerts
          - mdformat-myst
          - mdformat-simple-breaks
          - mdformat-web
