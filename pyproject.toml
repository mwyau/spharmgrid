[build-system]
requires = ["hatchling>=1.32.3"]
build-backend = "hatchling.build"

[project]
name = "spharmgrid"
version = "0.3.0"
description = "Spherical harmonic tools for filtering, regridding, and kinematics in atmospheric science with Xarray, PyTorch, and JAX"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Albert M. W. Yau", email = "albert@mwyau.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
    "ducc0>=0.39.0",
    "numpy>=1.24.0",
    "xarray>=2025.1.1",
]

[project.scripts]
spharmgrid = "spharmgrid.cli:main"

[project.urls]
Documentation = "https://spharmgrid.readthedocs.io/"
Repository = "https://github.com/mwyau/spharmgrid"
DOI = "https://doi.org/10.5281/zenodo.22559210"

[project.optional-dependencies]
cf = ["cf-xarray>=0.10.4"]
dask = ["dask[array]>=2024.1.0"]
cli = [
    "h5netcdf[h5py]>=1.8.1",
    "zarr>=3.0.0",
    "cfgrib>=0.9.15",
    "eccodeslib>=2.48.0; sys_platform != 'win32'",
]
jax = [
    "jax>=0.5.0",
    "s2fft>=1.4.0",
]
torch = [
    "torch>=2.13.0",
    "torch-harmonics==0.6.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/spharmgrid"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.github",
    "/AGENTS.md",
    "/benchmarks",
    "/.venv*",
    "/plans",
    "/skills",
]

[dependency-groups]
dev = [
    { include-group = "docs" },
    { include-group = "test" },
    "ruff>=0.16.5",
    "ty==0.0.82",
]
docs = [
    "myst-parser>=5.1.0",
    "pydata-sphinx-theme>=0.21.0",
    "sphinx>=9.0.4",
]
test = [
    "cftime>=1.6.5",
    "h5netcdf[h5py]>=1.8.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
torch-dev = [
    { include-group = "test" },
    "torch>=2.13.0",
    "torch-harmonics @ git+https://github.com/NVIDIA/torch-harmonics.git@v0.9.2",
]
jax-dev = [
    { include-group = "test" },
    "jax>=0.5.0",
    "s2fft>=1.4.0",
    "gdm-xarray-jax @ git+https://github.com/google-deepmind/xarray_jax.git@v0.1.1 ; python_version >= '3.12'",
]
cuda-dev = [
    { include-group = "jax-dev" },
    { include-group = "torch-dev" },
    "jax[cuda13]; sys_platform == 'linux'",
]
parity = [
    "pyspharm-syl>=1.2.1; python_version < '3.14'",
]

[tool.uv]
conflicts = [
    [
        { extra = "torch" },
        { group = "torch-dev" },
    ],
]

[tool.uv.sources]
# Temporary workaround: the S2FFT 1.4.0 abi3 wheel has a CPython-3.12-specific
# extension filename, so build that release from source on Python >=3.13.
s2fft = { git = "https://github.com/astro-informatics/s2fft.git", tag = "v1.4.0", marker = "python_version >= '3.13'" }

[[tool.uv.dependency-metadata]]
name = "torch-harmonics"
version = "0.9.2"
requires-python = ">=3.10"
requires-dist = ["torch>=2.6.0", "numpy>=1.22.4"]

[tool.uv.extra-build-dependencies]
torch-harmonics = [{ requirement = "torch", match-runtime = true }]

[tool.uv.extra-build-variables]
torch-harmonics = { CUDA_VISIBLE_DEVICES = "" }

[tool.pytest.ini_options]
addopts = ["-ra", "-q"]
testpaths = ["tests"]
strict_config = true
strict_markers = true
markers = [
    "parity: compares against an independently implemented transform package",
    "ncl: tests requiring NCL 6.6.2/SPHEREPACK",
    "jax_x64: tests requiring JAX x64 mode",
]

[tool.ruff]
target-version = "py311"
line-length = 88
force-exclude = true

[tool.ruff.lint]
select = ["ANN", "B", "C4", "E", "F", "I", "NPY", "PT", "SIM", "UP", "W"]
extend-select = ["PGH003", "PYI"]
preview = true

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.analysis]
allowed-unresolved-imports = [
    "ducc0",
    "ducc0.*",
    "jax",
    "jax.*",
    "s2fft",
    "s2fft.*",
    "torch",
    "torch.*",
    "torch_harmonics",
    "torch_harmonics.*",
    "xarray_jax",
    "xarray_jax.*",
]
strict-equality-semantics = true
strict-generic-narrowing = true

[tool.ty.rules]
blanket-ignore-comment = "error"
dynamic-function-decorator-return = "error"
missing-type-argument = "error"
possibly-unresolved-reference = "warn"
unsound-assignment = "error"
unsound-return-statement = "error"
unsound-yield = "error"
unsupported-dynamic-base = "warn"
