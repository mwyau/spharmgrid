[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "spharmgrid"
version = "0.1.0.dev0"
description = "Spherical harmonics regridding tool for atmospheric science"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Albert Yau" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
    "ducc0>=0.39.0",
    "numpy>=2.0.0",
    "xarray>=2025.11.0",
]

[project.scripts]
spharmgrid = "spharmgrid.cli:main"

[project.urls]
Documentation = "https://spharmgrid.readthedocs.io/"
Repository = "https://github.com/mwyau/spharmgrid"

[project.optional-dependencies]
cf = ["cf-xarray>=0.10.4"]
dask = ["dask[array]>=2024.1.0"]
grib = ["cfgrib>=0.9.15.1"]
netcdf = ["h5netcdf>=1.8.0"]
zarr = ["zarr>=3.0.0"]

[tool.uv]
default-groups = []

[tool.hatch.build.targets.wheel]
packages = ["src/spharmgrid"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.github",
    "/AGENTS.md",
    "/plans",
    "/skills",
]

[dependency-groups]
dev = [
    { include-group = "docs" },
    { include-group = "test" },
    "ruff>=0.16.5",
    "ty==0.0.78",
]
docs = [
    "myst-parser>=5.1.0",
    "sphinx>=9.1.0",
    "sphinx-rtd-theme>=3.1.0",
]
test = [
    "cfgrib>=0.9.15.1",
    "h5netcdf>=1.8.0",
    "pytest>=9.1.1",
    "zarr>=3.0.0",
]
# pyspharm-syl supplies the independent SPHEREPACK comparison implementation.
# Keep it out of normal test environments because it currently supports
# CPython through 3.13 rather than spharmgrid's full production matrix.
parity = ["pyspharm-syl>=1.2.1; python_version < '3.14'"]

[tool.pytest.ini_options]
addopts = ["-ra", "-q"]
testpaths = ["tests"]
strict_markers = true
markers = [
    "parity: compares against an independently implemented transform package",
]

[tool.ruff]
target-version = "py312"
line-length = 88
force-exclude = true

[tool.ruff.lint]
select = ["ANN", "B", "C4", "E", "F", "I", "NPY", "PT", "SIM", "UP", "W"]

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.analysis]
allowed-unresolved-imports = ["ducc0", "ducc0.*"]
